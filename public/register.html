<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gray-50 min-h-screen flex items-center justify-center bg-blue-100"
  >
    <div
      class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-8 border border-gray-100"
    >
      <!-- Header -->
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-semibold text-gray-800">
          Register Your Application
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          Create credentials for OAuth integration
        </p>
      </div>

      <!-- FORM -->
      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Application Name
          </label>
          <input
            name="name"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Website URL
          </label>
          <input
            name="website_url"
            type="url"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Redirect URI
          </label>
          <input
            name="redirect_uri"
            type="url"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          id="submitBtn"
          class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700"
        >
          Register Application
        </button>
      </form>

      <!-- RESULT SECTION -->
      <div id="result" class="hidden mt-6 border-t pt-6">
        <h2 class="text-lg font-semibold text-green-600 mb-4">
          ✅ Application Registered
        </h2>

        <div class="space-y-4">
          <div>
            <label class="text-sm text-gray-500">Client ID</label>
            <div class="flex gap-2 mt-1">
              <input
                id="clientId"
                readonly
                class="w-full px-3 py-2 border rounded-lg bg-gray-50"
              />
              <button
                onclick="copy('clientId')"
                class="px-3 bg-gray-200 rounded-lg"
              >
                Copy
              </button>
            </div>
          </div>

          <div>
            <label class="text-sm text-gray-500">Client Secret</label>
            <div class="flex gap-2 mt-1">
              <input
                id="clientSecret"
                readonly
                class="w-full px-3 py-2 border rounded-lg bg-gray-50"
              />
              <button
                onclick="copy('clientSecret')"
                class="px-3 bg-gray-200 rounded-lg"
              >
                Copy
              </button>
            </div>
          </div>

          <p class="text-xs text-red-500">
            ⚠️ Save this secret now. You won’t be able to see it again.
          </p>
        </div>
      </div>

      <!-- ERROR -->
      <p id="error" class="hidden text-red-500 text-sm mt-4"></p>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const result = document.getElementById("result");
      const errorBox = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("hidden");

        const formData = new FormData(form);
        const data = Object.fromEntries(formData);

        try {
          const res = await fetch("http://localhost:8000/register/website", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const json = await res.json();

          if (!res.ok) {
            throw new Error(json.error || "Failed");
          }

          // show result
          document.getElementById("clientId").value = json.client_id;
          document.getElementById("clientSecret").value = json.client_secret;

          form.classList.add("hidden");
          result.classList.remove("hidden");
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove("hidden");
        }
      });

      function copy(id) {
        const input = document.getElementById(id);
        input.select();
        document.execCommand("copy");
      }
    </script>
  </body>
</html>
